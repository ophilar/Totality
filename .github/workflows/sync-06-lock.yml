name: Synchronize 0.6 dependency lockfile
on:
  push:
    branches: [integration/optimization-rebased-candidate-20261106]
    paths: [.github/workflows/sync-06-lock.yml]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefer-offline
      - name: Commit lockfile
        run: |
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "fix(0.6): synchronize rebased dependencies"
            git push
          fi
