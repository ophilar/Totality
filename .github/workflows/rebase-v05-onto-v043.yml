name: Validate rebased Totality 0.5 with upstream 0.4.3
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rebase:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/rebase-v05-onto-upstream-v043
          fetch-depth: 0
          persist-credentials: true
      - name: Verify rebased ancestry and integration head
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor b351f160d3d581cd035097050b311c166ec17681 HEAD
          test "$(git rev-parse HEAD)" = b81a47f2b065437cfcb20e25d7fedce36cb9e713
          echo "Rebased, integrated HEAD $(git rev-parse --short HEAD)"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies and media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm ci
      - name: Typecheck and tests
        run: |
          npm run typecheck
          npm run test:run
          npm run build
