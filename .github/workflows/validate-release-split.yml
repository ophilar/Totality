name: Validate four linear Totality releases
on:
  push:
    branches:
      - automation/release-split-validation
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: master
            version: 0.4.3
          - branch: fixes
            version: 0.4.4
          - branch: timelines
            version: 0.5.0
          - branch: optimization
            version: 0.6.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify linear ancestry and release metadata
        shell: bash
        env:
          BRANCH: ${{ matrix.branch }}
          EXPECT_VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          node -e 'const p=require("./package.json"); const l=require("./package-lock.json"); for(const v of [p.version,l.version,l.packages[""].version]) if(v!==process.env.EXPECT_VERSION) process.exit(1)'
          git merge-base --is-ancestor f2f9d4942185b75614ffa8d080e5cd82a78a9216 HEAD
          case "$BRANCH" in
            master)
              test "$(git rev-parse HEAD)" = f2f9d4942185b75614ffa8d080e5cd82a78a9216
              ;;
            fixes)
              test "$(git rev-parse HEAD)" = bf6dc45299e46aa4da74aa873c9d35c6f3d39419
              test "$(git rev-list --count f2f9d4942185b75614ffa8d080e5cd82a78a9216..HEAD)" = 5
              ;;
            timelines)
              test "$(git rev-parse HEAD)" = b800fe628bc8e4bd338eeb921dea90e51fc6f9e9
              test "$(git rev-parse HEAD^)" = bf6dc45299e46aa4da74aa873c9d35c6f3d39419
              test -f src/main/ipc/timelines.ts
              test ! -f src/main/services/MeasuredOptimizationService.ts
              ;;
            optimization)
              test "$(git rev-parse HEAD)" = 44e525fce7b7ed27f48ecdc254902e273eb829e2
              test "$(git rev-parse HEAD^)" = b800fe628bc8e4bd338eeb921dea90e51fc6f9e9
              test -f src/main/ipc/timelines.ts
              test -f src/main/services/MeasuredOptimizationService.ts
              ;;
          esac
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Full tests
        run: npm run test:run
      - name: Vite build
        run: npx vite build
