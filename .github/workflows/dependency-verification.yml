name: Dependency verification

on:
  pull_request:
    branches: [fixes, timelines, optimization, '0.7', '0.9']
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/dependency-verification.yml'
      - '.github/workflows/release.yml'
      - 'src/**'
      - 'tests/**'
      - 'resources/**'
      - 'scripts/**'
      - 'vite.config.ts'
      - 'vitest.config.ts'
      - 'tsconfig*.json'
      - 'electron-builder.yml'
  push:
    branches: [fixes]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:run
      - name: Audit production dependencies
        if: runner.os == 'Linux'
        run: npm audit --omit=dev --audit-level=moderate
      - name: Typecheck
        if: runner.os == 'Linux'
        run: npx tsc --noEmit
      - name: Build application
        run: npx vite build
      - name: Check out upstream 0.4.2 schema
        if: runner.os == 'Linux'
        uses: actions/checkout@v5
        with:
          repository: bbidwell85/Totality
          ref: v0.4.2
          path: legacy
      - name: Verify real database upgrade
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          python3 scripts/verify-database-upgrade.py legacy/src/main/database/schema.ts
      - name: Package application
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
