name: Dependency verification

on:
  pull_request:
    branches: [master]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/dependency-verification.yml'
      - '.github/workflows/release.yml'
      - 'src/**'
      - 'tests/**'
      - 'resources/**'
      - 'scripts/**'
      - 'vite.config.ts'
      - 'vitest.config.ts'
      - 'tsconfig*.json'
      - 'electron-builder.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:run
      - name: Audit production dependencies
        if: runner.os == 'Linux'
        run: npm audit --omit=dev --audit-level=moderate
      - name: Typecheck
        if: runner.os == 'Linux'
        run: npx tsc --noEmit
      - name: Build application
        if: runner.os == 'Linux'
        run: npx vite build
