name: Dependency verification

on:
  pull_request:
    branches: [master]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/dependency-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:run
      - run: npx tsc --noEmit
      - run: npx vite build
