name: Validate read-only language and optimization decisions
on:
  push:
    branches: [upstream/08-language-optimization-decisions]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: upstream-optimization-decisions-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:run
      - run: npm run typecheck
      - run: npx vite build
      - run: npm run lint
