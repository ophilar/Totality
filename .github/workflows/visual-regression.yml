name: Totality visual comparison (0.4.4 vs 0.9)

on:
  workflow_dispatch:
  pull_request:
    branches: ['0.9']
    paths:
      - 'src/renderer/**'
      - 'src/main/**'
      - 'src/preload/**'
      - 'scripts/visual-regression.mjs'
      - '.github/workflows/visual-regression.yml'

concurrency:
  group: visual-comparison-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  visual-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout 0.4.4 reference
        uses: actions/checkout@v5
        with:
          ref: master
          path: baseline
      - name: Checkout candidate
        uses: actions/checkout@v5
        with:
          path: candidate
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            baseline/package-lock.json
            candidate/package-lock.json
      - name: Install real application dependencies
        run: |
          npm ci --prefix baseline
          npm ci --prefix candidate
      - name: Install Playwright runner without changing the application lockfile
        run: |
          npm install --prefix candidate --no-save --package-lock=false --ignore-scripts playwright@1.64.1
          cd candidate
          npx playwright install --with-deps chromium
      - name: Install system media, display and secure-keyring tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb dbus-x11 gnome-keyring libsecret-1-0
      - name: Build both real Electron applications
        run: |
          (cd baseline && npx vite build)
          (cd candidate && npx vite build)
      - name: Generate real local-media regression fixtures
        run: node candidate/scripts/visual-regression.mjs fixtures "$RUNNER_TEMP/visual-media"
      - name: Capture both versions with an ephemeral Linux secret service
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/keyring-runtime"
          chmod 700 "$RUNNER_TEMP/keyring-runtime"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/keyring-runtime"
          dbus-run-session -- bash -euo pipefail <<'SESSION'
          export XDG_CURRENT_DESKTOP=GNOME
          keyring_password="$(openssl rand -hex 32)"
          eval "$(printf '%s\n' "$keyring_password" | gnome-keyring-daemon --unlock --components=secrets)"
          unset keyring_password
          xvfb-run -a node candidate/scripts/visual-regression.mjs capture \
            "$GITHUB_WORKSPACE/baseline" "$RUNNER_TEMP/visual-media" \
            "$GITHUB_WORKSPACE/visual-report" 0.4.4 -
          DB=$(node -e "process.stdout.write(require('./visual-report/0.4.4.json').dbPath)")
          xvfb-run -a node candidate/scripts/visual-regression.mjs capture \
            "$GITHUB_WORKSPACE/candidate" "$RUNNER_TEMP/visual-media" \
            "$GITHUB_WORKSPACE/visual-report" 0.9 "$DB"
          SESSION
      - name: Generate visual difference report
        run: node candidate/scripts/visual-regression.mjs report "$GITHUB_WORKSPACE/visual-report"
      - name: Upload inspectable HTML comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: totality-044-vs-09-visual-report
          if-no-files-found: warn
          retention-days: 3
          path: |
            visual-report/index.html
            visual-report/*.json
            visual-report/0.4.4/**/*.png
            visual-report/0.9/**/*.png
            visual-report/diffs/**/*.png
