name: Validate independent bugfixes rebased onto upstream master
on:
  push:
    branches:
      - automation/upstream-fix-validation-runner
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        branch:
          - upstream/fix-v043-scan-integrity
          - upstream/fix-v043-scan-status
          - upstream/fix-v043-wishlist-identity
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assert clean upstream master ancestry
        shell: bash
        run: |
          git merge-base --is-ancestor f2f9d4942185b75614ffa8d080e5cd82a78a9216 HEAD
          test "$(git rev-list --count f2f9d4942185b75614ffa8d080e5cd82a78a9216..HEAD)" = 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Full tests
        run: npm run test:run
      - name: Vite build
        run: npx vite build
