name: Totality 0.5 validation

on:
  pull_request:
    branches: [v0.5.0-clean]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Focused regression tests
        run: npx vitest run tests/unit/services/OptimizationCodecPolicy.test.ts tests/unit/services/OptimizationCandidateService.test.ts tests/unit/services/MeasuredOptimizationPolicy.test.ts tests/unit/services/OptimizationSavingsService.test.ts tests/unit/OptimizationUiContract.test.ts tests/unit/TaskQueueService.test.ts
