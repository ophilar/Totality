name: Totality 0.5 validation

on:
  pull_request:
    branches: [v0.5.0-clean]

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install FFmpeg and FFprobe (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install FFmpeg and FFprobe (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install FFmpeg and FFprobe (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ffmpeg -y --no-progress

      - name: Verify media tools
        shell: bash
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Typecheck
        run: npm run typecheck
      - name: Focused regression tests
        run: npx vitest run tests/unit/services/OptimizationCodecPolicy.test.ts tests/unit/services/OptimizationCandidateService.test.ts tests/unit/services/MeasuredOptimizationPolicy.test.ts tests/unit/services/OptimizationSavingsService.test.ts tests/unit/OptimizationUiContract.test.ts tests/unit/TaskQueueService.test.ts
      - name: Full test suite
        run: npm run test:run
