name: Validate canonical linear Totality history
on:
  push:
    branches: [automation/rebase-v05-onto-v043-runner]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.5.0-clean
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Rebuild upstream maintenance, core, and timeline on one linear chain
        shell: bash
        run: |
          set -euo pipefail
          OLD_FIXES=8d34523752b6c75ff62270638d13a38a1f5375fc
          OLD_CORE_BASE=a4fe89593b3dcc7aff8aa17bc4283ec6028b0bc1
          OLD_CORE=8973f6fa06c39cd33635af7b078e5a3ea7327137
          OLD_FEATURE=564667402ab2553819bcdfe3950cc3a7851957a4
          OLD_MASTER=b8a57ef5f8879211c53b824afdefd005a30156e8
          test "$(git rev-parse origin/upstream/fix-v043-combined)" = "$OLD_FIXES"
          test "$(git rev-parse origin/v0.5.0-clean)" = "$OLD_CORE"
          test "$(git rev-parse origin/feature/timelines)" = "$OLD_FEATURE"
          test "$(git rev-parse origin/master)" = "$OLD_MASTER"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c canonical-master "$OLD_FIXES"
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          path = Path('package-lock.json')
          data = path.read_text()
          match = re.compile(r'("node_modules/fast-uri": \{\s*"version": )"3\.1\.8"(,\s*"resolved": )"[^"]*fast-uri-3\.1\.8\.tgz"(,\s*"integrity": )"[^"]+"')
          def patch(m):
              return (m.group(1) + '"3.1.9"' + m.group(2) + '"https://registry.npmjs.org/fast-uri/-/fast-uri-3.1.9.tgz"' + m.group(3) + '"sha512-hS/0Wt3Ya043oKXs0sIxrMpKQITXhMLIrVAKKXi4gozGC9v7YRWVnXIZzjNPTO02M9BdxLCWqK1yRXgNziVyJQ=="')
          updated, count = match.subn(patch, data)
          assert count == 1, f"fast-uri lock entry missing or unexpected: {count}"
          assert json.loads(updated)['packages']['node_modules/fast-uri']['version'] == '3.1.9'
          path.write_text(updated)
          PY
          test "$(git diff --name-only)" = package-lock.json
          git add package-lock.json
          git commit -m "fix(deps): update vulnerable fast-uri to 3.1.9"
          MAINTENANCE="$(git rev-parse HEAD)"
          git switch -c canonical-core "$MAINTENANCE"
          git restore --source="$OLD_CORE_BASE" --staged --worktree .
          test "$(git write-tree)" = "$(git rev-parse "$OLD_CORE_BASE^{tree}")"
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          path = Path('package-lock.json')
          data = path.read_text()
          pat = re.compile(r'("node_modules/fast-uri": \{\s*"version": )"3\.1\.8"(,\s*"resolved": )"[^"]*fast-uri-3\.1\.8\.tgz"(,\s*"integrity": )"[^"]+"')
          def replace(m):
              return m.group(1) + '"3.1.9"' + m.group(2) + '"https://registry.npmjs.org/fast-uri/-/fast-uri-3.1.9.tgz"' + m.group(3) + '"sha512-hS/0Wt3Ya043oKXs0sIxrMpKQITXhMLIrVAKKXi4gozGC9v7YRWVnXIZzjNPTO02M9BdxLCWqK1yRXgNziVyJQ=="'
          data, count = pat.subn(replace, data)
          assert count == 1
          assert json.loads(data)['packages']['node_modules/fast-uri']['version'] == '3.1.9'
          path.write_text(data)
          PY
          git add -A
          git commit -m "feat(v0.5): restore the timeline-free core atop upstream fixes"
          git cherry-pick "$OLD_CORE_BASE..$OLD_CORE"
          NEW_CORE="$(git rev-parse HEAD)"
          test "$(git rev-list --count "$MAINTENANCE..$NEW_CORE")" = 29
          test "$(git rev-list --merges --count "$MAINTENANCE..$NEW_CORE")" = 0
          git switch -c canonical-timelines "$OLD_FEATURE"
          git rebase --onto "$NEW_CORE" "$OLD_CORE" canonical-timelines
          test "$(git rev-parse HEAD^)" = "$NEW_CORE"
          git diff --name-only "$OLD_CORE" "$OLD_FEATURE" | sort >/tmp/original-files
          git diff --name-only "$NEW_CORE" HEAD | sort >/tmp/rebased-files
          diff -u /tmp/original-files /tmp/rebased-files
          git diff "$OLD_CORE" "$OLD_FEATURE" >/tmp/original-timelines.patch
          git diff "$NEW_CORE" HEAD >/tmp/rebased-timelines.patch
          cmp /tmp/original-timelines.patch /tmp/rebased-timelines.patch
          echo "::notice::Canonical master $MAINTENANCE core $NEW_CORE feature $(git rev-parse HEAD)"
          git switch canonical-master
      - name: Install and verify upstream-only fixes plus dependency update
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run test:run
          npx tsc --noEmit
          npx vite build
      - name: Validate core with security update
        shell: bash
        run: |
          set -euo pipefail
          git switch canonical-core
          npm ci
          npm run typecheck
          npm run test:run
          npm run renderer:build
      - name: Validate Timelines on updated core
        shell: bash
        run: |
          set -euo pipefail
          git switch canonical-timelines
          npm run typecheck
          npm run test:run
          npm run renderer:build
          echo "Canonical linear history and three branch trees validated."
      - name: Archive all prior refs and publish three linear branches
        shell: bash
        run: |
          set -euo pipefail
          NEW_MASTER="$(git rev-parse canonical-master)"
          NEW_CORE="$(git rev-parse canonical-core)"
          NEW_FEATURE="$(git rev-parse canonical-timelines)"
          git merge-base --is-ancestor "$NEW_MASTER" "$NEW_CORE"
          test "$(git rev-parse "$NEW_FEATURE^")" = "$NEW_CORE"
          test "$(git for-each-ref --format='%(objectname)' refs/remotes/origin | sort -u | wc -l)" -ge 20
          OLD_MASTER=b8a57ef5f8879211c53b824afdefd005a30156e8
          archive_tree="$(git rev-parse "$OLD_MASTER^{tree}")"
          archive="$(git commit-tree "$archive_tree" $(git for-each-ref --format='-p %(objectname)' refs/remotes/origin | sort -u) -m "Archive all prior Totality branch tips before linearization")"
          git tag -a archive/pre-linear-cleanup-20261102 "$archive" -m "Historical branch-tip archive; Git parents preserve original commit graphs and all branches removed during cleanup"
          git push origin refs/tags/archive/pre-linear-cleanup-20261102
          git push "--force-with-lease=refs/heads/master:$OLD_MASTER" origin "$NEW_MASTER:refs/heads/master"
          git push "--force-with-lease=refs/heads/v0.5.0-clean:8973f6fa06c39cd33635af7b078e5a3ea7327137" origin "$NEW_CORE:refs/heads/v0.5.0-clean"
          git push "--force-with-lease=refs/heads/feature/timelines:564667402ab2553819bcdfe3950cc3a7851957a4" origin "$NEW_FEATURE:refs/heads/feature/timelines"
          echo "::notice::Canonical master $NEW_MASTER; core $NEW_CORE; timeline $NEW_FEATURE; old refs protected in archive/pre-linear-cleanup-20261102"
