name: Validate branch layers

on:
  workflow_dispatch:
  pull_request:
    branches:
      - architecture
      - optimization
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'resources/**'
      - 'package*.json'
      - 'vite.config.ts'
      - 'vitest.config.ts'
      - 'tsconfig*.json'
      - 'electron-builder.yml'
      - '.github/workflows/branch-validation.yml'

permissions:
  contents: read

concurrency:
  group: branch-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Ensure FFmpeg and FFprobe (Linux)
        if: runner.os == 'Linux'
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Ensure FFmpeg and FFprobe (macOS)
        if: runner.os == 'macOS'
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            brew install ffmpeg
          fi
      - name: Ensure FFmpeg and FFprobe (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
      - name: Unit and integration tests
        run: npm run test:run
      - name: TypeScript typecheck
        if: runner.os == 'Linux'
        run: npx tsc --noEmit
      - name: Renderer build
        if: runner.os == 'Linux'
        run: npx vite build
