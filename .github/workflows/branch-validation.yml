name: Validate branch layers

on:
  workflow_dispatch:
    inputs:
      full_matrix:
        description: Run Linux, macOS and Windows (release readiness)
        type: boolean
        default: true
  pull_request:
    branches:
      - architecture
      - optimization
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'resources/**'
      - 'package*.json'
      - 'vite.config.ts'
      - 'vitest.config.ts'
      - 'tsconfig*.json'
      - 'electron-builder.yml'
      - '.github/workflows/branch-validation.yml'

permissions:
  contents: read

concurrency:
  group: branch-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.full_matrix && '["ubuntu-24.04","macos-15","windows-2025"]' || '["ubuntu-24.04"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ffmpeg -y --no-progress
      - name: Unit and integration tests
        run: npm run test:run
      - name: TypeScript typecheck
        run: npx tsc --noEmit
      - name: Renderer build
        run: npx vite build
