name: Validate branch layers

on:
  workflow_dispatch:
  pull_request:
    branches:
      - fixes
      - timelines
      - optimization
      - architecture
      - '0.7'
      - '0.9'
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'resources/**'
      - 'package*.json'
      - 'vite.config.ts'
      - 'vitest.config.ts'
      - 'vitest.config.mts'
      - 'tsconfig*.json'
      - 'electron-builder.yml'
      - '.github/workflows/branch-validation.yml'

permissions:
  contents: read

concurrency:
  group: branch-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Shared tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Ensure FFmpeg and FFprobe
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - run: npm run test:run
      - run: npx tsc --noEmit
      - run: npx vite build

  platform-smoke:
    name: Package smoke (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15-intel]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx vite build
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
